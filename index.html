<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#FFF8EE">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="Since You Left">

    <meta name="description"
        content="A live counter showing how much time has passed.">

    <title>Since You Left 🍊</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <main>

        <!-- HERO -->

        <section class="hero">

            <div class="orange-icon">
                🍊
            </div>

            <h1>Since You Left</h1>

            <p class="date"></p>

            <div class="scroll-indicator">

                Scroll Down

                <div class="arrow">↓</div>

            </div>

        </section>


        <!-- DAYS -->

        <section class="counter">

            <div class="small-title">
                Time Passed
            </div>

            <h2 id="days" class="number">
                0
            </h2>

            <p class="title">
                Days
            </p>

            <p id="daysWords" class="words">
                Zero
            </p>

        </section>


        <!-- HOURS -->

        <section class="counter">

            <div class="small-title">
                Time Passed
            </div>

            <h2 id="hours" class="number">
                0
            </h2>

            <p class="title">
                Hours
            </p>

            <p id="hoursWords" class="words">
                Zero
            </p>

        </section>


        <!-- MINUTES -->

        <section class="counter">

            <div class="small-title">
                Time Passed
            </div>

            <h2 id="minutes" class="number">
                0
            </h2>

            <p class="title">
                Minutes
            </p>

            <p id="minutesWords" class="words">
                Zero
            </p>

        </section>


        <!-- SECONDS -->

        <section class="counter">

            <div class="small-title">
                Time Passed
            </div>

            <h2 id="seconds" class="number">
                0
            </h2>

            <p class="title">
                Seconds
            </p>

            <p id="secondsWords" class="words">
                Zero
            </p>

        </section>


        <!-- FINAL PAGE -->

        <section class="ending">

            <div class="orange-icon">
                🍊
            </div>

            <h2>
                Every Second Counts.
            </h2>

            <p class="ending-text">

                From that afternoon...

                <br><br>

                Time never stopped.

                <br>

                Neither did the memories.

            </p>

            <div id="liveTime" class="live-counter">

                0 seconds and counting...

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
